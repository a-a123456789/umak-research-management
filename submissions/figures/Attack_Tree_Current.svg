-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Scenario DREAD: 7.6</text><rect x="15" y="290" width="340" height="110" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="185.0" y="314" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Vulnerable concatenated query</text><text x="185.0" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">AND sufficient query/table privileges</text><text x="185.0" y="356" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Patched: parameterized query</text><text x="185.0" y="377" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Isolated exploit only</text><rect x="380" y="290" width="340" height="110" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="550.0" y="314" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Obtain usable credential</text><text x="550.0" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">AND reach the service</text><text x="550.0" y="356" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">AND sufficient permissions</text><text x="550.0" y="377" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Hook + CI reduce accidental exposure</text><rect x="745" y="290" width="340" height="110" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="915.0" y="314" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Export a private copy</text><text x="915.0" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">AND unintended public access</text><text x="915.0" y="356" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">No public export route implemented</text><text x="915.0" y="377" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Cloud exposure is proposed risk</text><text x="20" y="495" font-family="Arial" font-size="13">Scores are planning assumptions