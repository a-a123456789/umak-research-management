<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176f78"/></marker></defs><path d="M500.0,70 L500.0,105" fill="none" stroke="#176f78" stroke-width="2" marker-end="url(#a)"/><path d="M500.0,170 L205.0,235" fill="none" stroke="#176f78" stroke-width="2" marker-end="url(#a)"/><path d="M500.0,170 L785.0,235" fill="none" stroke="#176f78" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="10" width="340" height="60" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="500.0" y="34" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Presentation: test client</text><text x="500.0" y="55" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Future CRM browser UI</text><rect x="300" y="105" width="400" height="65" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="500.0" y="129" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Express: authenticate staff + bound requests</text><text x="500.0" y="150" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Fixed child process; JSON pipes</text><rect x="30" y="235" width="350" height="85" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="205.0" y="259" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">PostgreSQL</text><text x="205.0" y="280" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">IAS identity / research / privacy records</text><text x="205.0" y="301" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">No worker connection</text><rect x="600" y="235" width="370" height="85" rx="8" fill="#e5f2f3" stroke="#176f78"/><text x="785.0" y="259" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Python worker -&gt; pure DAG core</text><text x="785.0" y="280" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">Evidence gates + readiness + duration</text><text x="785.0" y="301" text-anchor="middle" font-family="Arial" font-size="16" fill="#183747">No framework or DB dependency</text><text x="20" y="385" font-family="Arial" font-size="13">Responses return over the same interfaces. Limits: 2 concurrent children, 5 seconds, 2 MiB input.</text></svg>