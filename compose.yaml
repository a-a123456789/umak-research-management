services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: crm_ias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crm_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_ias"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crm_pg:
