name: security-gate
on:
  push:
    branches: [main, 'codex/**', 'team/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: crm_ias
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ias"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/crm_ias
      ALLOW_SYNTHETIC_SETUP: 'yes'
      ALLOW_ISOLATED_DEMO: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral synthetic credentials
        run: |
          node --input-type=module <<'JS'
          import {randomBytes} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const p=randomBytes(24).toString('hex'),d=randomBytes(16).toString('hex');
          console.log(`::add-mask::${p}`);console.log(`::add-mask::${d}`);
          appendFileSync(process.env.GITHUB_ENV,`APP_DB_PASSWORD=${p}\nDEMO_PASSWORD=${d}\nDATABASE_URL=postgresql://crm_app:${p}@127.0.0.1:5432/crm_ias\n`);
          JS
      - name: Verify skill provenance and admission policy
        run: |
          npm run check:skills
          npm run test:skills
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check:secrets
      - run: npm run check:static
      - name: Gitleaks scan
        run: |
          mkdir -p .private
          scan_status=0
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner --report-format json --report-path /repo/.private/gitleaks-report.json || scan_status=$?
          python - <<'PYCODE'
          import json
          from pathlib import Path
          report = Path('.private/gitleaks-report.json')
          if report.exists():
              findings = json.loads(report.read_text())
              print(f'Gitleaks findings: {len(findings)}')
              for finding in findings:
                  print(json.dumps({key: finding.get(key) for key in ('File', 'StartLine', 'RuleID', 'Fingerprint')}))
          else:
              print('Gitleaks did not produce a findings report; inspect the scanner error above.')
          PYCODE
          exit "$scan_status"
      - name: Semgrep application scan
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.116.0 semgrep scan --config /src/.semgrep.yml --error /src/src
      - run: python -m pip install -r security/validation/requirements.txt
      - run: python security/validation/validate_package.py
      - run: python scripts/validate-algorithm-contracts.py
      - run: npm run db:setup
      - run: npm test
      - run: npm run demo:sqli
      - run: npm run demo:secret
      - name: Backup and restore with matching PostgreSQL client
        run: |
          mkdir -p .private/pgbin
          cat > .private/pgbin/pg_dump <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -v /tmp:/tmp postgres:18.3 pg_dump "$@"
          SH
          cat > .private/pgbin/pg_restore <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -v /tmp:/tmp postgres:18.3 pg_restore "$@"
          SH
          chmod +x .private/pgbin/*
          PATH="$PWD/.private/pgbin:$PATH" npm run backup:verify
