name: android-library
on:
  push:
    paths: ['android-public-cache/**', '.github/workflows/android-library.yml']
  pull_request:
    paths: ['android-public-cache/**', '.github/workflows/android-library.yml']
permissions:
  contents: read
jobs:
  android-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: android-public-cache/gradlew -p android-public-cache assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
