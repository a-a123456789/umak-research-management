name: audit-sandbox
on:
  workflow_dispatch:
  push:
    branches: [codex/linux-audit-sandbox]
permissions:
  contents: read
concurrency:
  group: audit-sandbox-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify skill admission and launcher tests
        run: |
          node scripts/check-skills.js
          node --test test/skill-integrity.test.js
          python3 -m unittest discover -s security/sandbox -p 'test_*.py'
      - name: Run isolated probes and approved workload
        run: python3 scripts/audit-sandbox.py --output "$RUNNER_TEMP/audit-sandbox-evidence"
      - name: Upload bounded host-generated receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-sandbox-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 14
